<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOMUS · Mercaimpulso diario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f2;--card:#ffffff;--ink:#1f1b1a;--ink2:#5c5452;--muted:#8a817e;--line:#e7e1de;
  --acc:#8f1d2c;--acc2:#b8384a;--accbg:#fbeef0;
  --good:#1a7f37;--goodbg:#e8f5ec;--warn:#9a5b00;--warnbg:#fff4e0;--crit:#b3261e;--critbg:#fdecea;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--acc);color:#fff;padding:10px 14px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.brand .who{font-size:12.5px;opacity:.9;text-align:right}
.brand .who button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;margin-left:6px;cursor:pointer}
nav{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
nav button{background:transparent;border:0;color:rgba(255,255,255,.78);padding:9px 12px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#fff}
main{max-width:980px;margin:0 auto;padding:14px 12px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:15.5px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .n{background:var(--acc);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid #d6cfcc;border-radius:9px;padding:10px;background:#fff;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);outline-offset:0;border-color:var(--acc2)}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid #d6cfcc;background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
.btn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
/* product rows */
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools input{flex:1;min-width:160px}
.prod{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.prod.act{border-color:#d9a9b0;background:#fffafa}
.prod.err{border-color:var(--crit);background:var(--critbg)}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:8px}
.pn{font-weight:600;font-size:14px}
.pc{color:var(--muted);font-size:12px;white-space:nowrap}
.pg{display:grid;grid-template-columns:repeat(4,1fr) 1.35fr;gap:6px;align-items:end}
@media (max-width:620px){.pg{grid-template-columns:repeat(4,1fr)}.pg .vto{grid-column:1 / span 3}}
.pg label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:2px}
.pg input{padding:8px 6px;min-height:40px;text-align:center}
.pg .vto input{text-align:left}
.pf{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;gap:8px;flex-wrap:wrap}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.chip.good{background:var(--goodbg);color:var(--good)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.crit{background:var(--critbg);color:var(--crit)}
.chip.neu{background:#f0ecea;color:var(--ink2)}
.ck{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:13px}
.ck input{width:18px;height:18px}
/* sticky save */
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:30;display:none}
.savebar .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center}
.savebar .msg{flex:1;font-size:13px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1f1b1a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:92vw;display:none}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .t{font-size:12px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select{width:auto;min-width:140px;flex:1}
.empty{color:var(--muted);text-align:center;padding:24px 10px}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.banner{border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.banner.warn{background:var(--warnbg);color:#6b3f00}
.banner.crit{background:var(--critbg);color:#7a1a14}
.banner.info{background:#eef3f8;color:#1e3a56}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:#1f1b1a;color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap;display:none;z-index:5}
.defs dt{font-weight:600;margin-top:10px}
.defs dd{margin:2px 0 0;color:var(--ink2);font-size:13.5px}
.cfgtable input,.cfgtable select{min-height:36px;padding:6px 8px;font-size:13px}
.small{font-size:12.5px;color:var(--muted)}
.foto img{max-width:100%;border-radius:10px;margin-top:8px;max-height:260px;object-fit:cover}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>LOMUS · Mercaimpulso</h1>
    <div class="who" id="who"></div>
  </div>
  <nav id="nav">
    <button data-v="reg" class="on">Registrar</button>
    <button data-v="mis">Mis registros</button>
    <button data-v="tab">Tablero</button>
    <button data-v="kpi">Indicadores</button>
    <button data-v="cfg" class="hidden">Configuración</button>
  </nav>
</header>
<main id="main"><div class="empty">Cargando…</div></main>
<div class="savebar" id="savebar"><div class="in"><div class="msg" id="savemsg"></div><button class="btn" id="savebtn">Guardar registro</button></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ Estado ============ */
const TURNOS=["Mañana","Tarde","Completa"];
const TIPOS=["Laboral","Descanso","Festivo","Incapacidad","Capacitación","Vacaciones"];
const NOVEDADES=["Producto en mal estado","Faltante en pedido","Precio errado","Falla cadena de frío","Espacio reducido / sin exhibición","Competencia con promoción","Otro"];
const MARCAS_DEF=["Colanta","Porcicarnes","Cervalle","Supercerdo","Marca propia cadena","Otra"];
const S={db:null,user:null,assets:null,downloads:null,uid:null,isOwner:false,
  cfg:null,cfgLoaded:false,perfil:null,view:"reg",form:null,regsTab:[],misRegs:[],
  tabF:{rango:"7",imp:"",pdv:""},prodFilter:"",soloMov:false,dbReady:false,writeBlocked:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v===null||v===undefined)return null;const n=Number(String(v).replace(",","."));return isFinite(n)?n:null};
const fmt=(n,d=1)=>n===null||n===undefined||!isFinite(n)?"–":n.toLocaleString("es-CO",{maximumFractionDigits:d,minimumFractionDigits:0});
const pct=(n,d=0)=>n===null||n===undefined||!isFinite(n)?"–":(n*100).toLocaleString("es-CO",{maximumFractionDigits:d})+" %";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/864e5);
const slug=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"x";
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(m,ms=2600){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display="none",ms)}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:"timeout"}),ms))]);

/* ============ Catálogo / helpers ============ */
const cat=()=>(S.cfg?.catalogo||[]).filter(p=>p.activo!==false);
const prodBy=cod=>(S.cfg?.catalogo||[]).find(p=>String(p.cod)===String(cod));
const pdvBy=id=>(S.cfg?.pdvs||[]).find(p=>p.id===id);
const impBy=id=>(S.cfg?.equipo||[]).find(p=>p.id===id);
const metas=()=>Object.assign({doh:4,merma:0.02,osa:0.95,alertaVto:5,sos:0.3,conv:0.15},S.cfg?.metas||{});
function kgEq(cod,q){if(q===null||q===undefined)return null;const p=prodBy(cod);if(!p)return null;if(p.unidad==="kg")return q;return p.peso?q*p.peso:null}
function unidadTxt(p){return p.unidad==="kg"?"kg":(p.peso?`und (${fmt(p.peso*1000,0)} g)`:"und")}
function myImp(){return S.perfil?impBy(S.perfil.impId):null}
function isSup(){if(S.isOwner)return true;const m=myImp();return m&&m.rol==="supervisor"}

/* ============ Inicio ============ */
async function init(){
  bindNav();
  const C=window.claude;
  if(!C||!C.use){renderNoDb();return}
  const [db,user]=await Promise.all([C.use("db"),C.use("user")]);
  S.db=db;S.user=user;
  C.use("assets").then(a=>S.assets=a).catch(()=>{});
  C.use("downloads").then(d=>S.downloads=d).catch(()=>{});
  if(!db){renderNoDb();return}
  try{S.isOwner=user?!!(await user.isOwner()):false}catch(e){}
  try{S.uid=user?await user.id():null}catch(e){}
  try{if(user&&user.can){const c=await user.can("data.write");if(c===false)S.writeBlocked=true}}catch(e){}
  if(S.isOwner)$('#nav [data-v=cfg]').classList.remove("hidden");
  // config en vivo
  const t=setTimeout(()=>{if(!S.cfgLoaded){S.cfgLoaded=true;render()}},10000);
  db.doc("config/general").onSnapshot(snap=>{clearTimeout(t);S.cfg=snap.exists?snap.data():null;S.cfgLoaded=true;S.dbReady=true;renderWho();if(S.view!=="reg"||!S.form)render();else refreshFormMeta()},err=>{clearTimeout(t);S.cfgLoaded=true;render()});
  // perfil
  if(S.uid){try{const p=await withTimeout(db.doc("perfiles/"+S.uid).get(),10000);if(p.exists)S.perfil=p.data()}catch(e){}}
  else S.perfil=LS.get("lomus_perfil",null);
  renderWho();
  flushPending();
  window.addEventListener("online",flushPending);
}
function renderNoDb(){$("#main").innerHTML=`<div class="card"><h2>Inicia sesión para registrar</h2><p class="hint">Esta app guarda los registros en una base compartida. Abre el enlace con tu cuenta de Claude (la que LOMUS invitó). Si ya iniciaste sesión, pide a tu jefe que te dé acceso de edición.</p></div>`}
function bindNav(){document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));render();window.scrollTo(0,0)})}
function renderWho(){const m=myImp();$("#who").innerHTML=(m?esc(m.nombre):(S.isOwner?"Administración":""))+(S.uid||!S.isOwner?` <button id="chg">${m?"Cambiar":"Identificarme"}</button>`:"");const c=$("#chg");if(c)c.onclick=()=>{S.perfil=null;S.view="reg";S.form=null;render()}}

function render(){
  $("#savebar").style.display="none";
  if(!S.cfgLoaded){$("#main").innerHTML=`<div class="empty">Cargando configuración…</div>`;return}
  if(!S.cfg){$("#main").innerHTML=`<div class="card"><h2>Configuración pendiente</h2><p class="hint">${S.isOwner?"Aún no hay catálogo, puntos de venta ni equipo. Ve a <b>Configuración</b>.":"La administración aún no ha cargado el catálogo. Intenta más tarde."}</p></div>`+(S.view==="cfg"&&S.isOwner?"":"");if(S.view==="cfg"&&S.isOwner)renderCfg();if(S.view==="kpi")renderKpiDefs();return}
  if(S.view==="reg")renderReg();
  else if(S.view==="mis")renderMis();
  else if(S.view==="tab")renderTab();
  else if(S.view==="kpi")renderKpiDefs();
  else if(S.view==="cfg")renderCfg();
}

/* ============ Identificación ============ */
function renderIdent(){
  const eq=(S.cfg.equipo||[]).filter(e=>e.activo!==false);
  $("#main").innerHTML=`<div class="card"><h2>¿Quién eres?</h2><p class="hint">Elige tu nombre una sola vez. Así cada registro queda a tu nombre, con fecha y hora.</p>
  <div class="list" style="margin-top:10px">${eq.map(e=>`<div class="it" data-id="${esc(e.id)}"><div class="sp"><b>${esc(e.nombre)}</b><div class="small">${esc(e.rol==="supervisor"?"Supervisión":"Mercaimpulsadora")}${e.ciudad?" · "+esc(e.ciudad):""}</div></div><span class="chip neu">Soy yo</span></div>`).join("")||`<div class="empty">No hay equipo configurado.</div>`}</div></div>`;
  document.querySelectorAll(".list .it").forEach(el=>el.onclick=async()=>{
    S.perfil={impId:el.dataset.id,desde:new Date().toISOString()};
    if(S.uid){try{await withTimeout(S.db.doc("perfiles/"+S.uid).set(S.perfil),12000)}catch(e){toast("No se pudo guardar tu identificación en línea; quedó en este teléfono.")}}
    LS.set("lomus_perfil",S.perfil);renderWho();S.form=null;render();
  });
}

/* ============ Registrar ============ */
function newForm(){
  const m=myImp();const d=LS.get("lomus_draft",null);
  if(d&&d.impId===(m&&m.id)&&d.fecha>=addDays(today(),-2))return d;
  const pd=(m&&m.pdvs&&m.pdvs.length===1)?m.pdvs[0]:"";
  const h=new Date().getHours();
  return {impId:m?m.id:"",fecha:today(),tipoDia:"Laboral",pdvId:pd,turno:h<13?"Mañana":"Tarde",items:{},ejec:{},comp:{},impulso:{},nov:[],obs:"",fotoId:"",fotoUrl:"",_prefill:null};
}
function docId(f){return `${f.fecha}_${slug(f.impId)}_${slug(f.pdvId)}_${slug(f.turno)}`}
function saveDraft(){clearTimeout(saveDraft._t);saveDraft._t=setTimeout(()=>LS.set("lomus_draft",S.form),400)}

function renderReg(){
  if(!S.perfil||!myImp()){if(S.isOwner&&!S.perfil){$("#main").innerHTML=`<div class="card"><h2>Hola, administración</h2><p class="hint">Como dueña de la app ves el <b>Tablero</b> y la <b>Configuración</b>. Si también quieres registrar como una persona del equipo, identifícate.</p><div class="row" style="margin-top:10px"><button class="btn" id="goTab">Ver tablero</button><button class="btn sec" id="goId">Identificarme</button></div></div>`;$("#goTab").onclick=()=>$('#nav [data-v=tab]').click();$("#goId").onclick=()=>{S.perfil={};renderIdent()};return}renderIdent();return}
  if(!S.form)S.form=newForm();
  const f=S.form,m=myImp();
  const pdvs=S.cfg.pdvs||[];const mine=pdvs.filter(p=>(m.pdvs||[]).includes(p.id)),others=pdvs.filter(p=>!(m.pdvs||[]).includes(p.id)&&p.activo!==false);
  const lab=f.tipoDia==="Laboral";
  const comps=(S.cfg.marcasCompetencia||MARCAS_DEF);
  $("#main").innerHTML=`
  ${S.writeBlocked?`<div class="banner crit">✕ Tu acceso es solo de lectura. Pide a tu jefe acceso de edición para poder guardar.</div>`:""}
  <div id="pendBanner"></div>
  <div class="card"><h2><span class="n">1</span>Jornada</h2>
    <div class="grid2">
      <div><label class="f">Fecha</label><input type="date" id="fFecha" value="${f.fecha}" max="${today()}" min="${addDays(today(),-3)}"></div>
      <div><label class="f">Turno</label><select id="fTurno">${TURNOS.map(t=>`<option ${t===f.turno?"selected":""}>${t}</option>`).join("")}</select></div>
    </div>
    <div style="margin-top:10px"><label class="f">Tipo de día</label><div class="seg" id="fTipo">${TIPOS.map(t=>`<button data-t="${t}" class="${t===f.tipoDia?"on":""}">${t}</button>`).join("")}</div>
    <p class="hint">Descanso, festivo o incapacidad se marcan aquí (no en el punto de venta). Así sabemos que no es un día sin reporte.</p></div>
    <div style="margin-top:10px" class="${lab?"":"hidden"}"><label class="f">Punto de venta</label><select id="fPdv"><option value="">— Elige el punto de venta —</option>
      ${mine.length?`<optgroup label="Mis puntos asignados">${mine.map(p=>`<option value="${esc(p.id)}" ${p.id===f.pdvId?"selected":""}>${esc(p.nombre)}${p.ciudad?" · "+esc(p.ciudad):""}</option>`).join("")}</optgroup>`:""}
      <optgroup label="Otros puntos">${others.map(p=>`<option value="${esc(p.id)}" ${p.id===f.pdvId?"selected":""}>${esc(p.nombre)}${p.ciudad?" · "+esc(p.ciudad):""}</option>`).join("")}</optgroup></select>
      <p class="hint" id="prefillHint"></p></div>
  </div>
  <div class="${lab?"":"hidden"}">
  <div class="card"><h2><span class="n">2</span>Inventario y vencimientos</h2>
    <p class="hint" style="margin:-4px 0 10px">Inicial · Recibido (pedido que llegó) · Final · Avería/devolución. La venta se calcula sola. Fecha de vencimiento = la <b>más próxima</b> que haya en góndola.</p>
    <div class="tools"><input type="text" id="pSearch" placeholder="Buscar producto o código" value="${esc(S.prodFilter)}"><label class="ck"><input type="checkbox" id="pMov" ${S.soloMov?"checked":""}> Solo con datos</label></div>
    <div id="prods"></div>
  </div>
  <div class="card"><h2><span class="n">3</span>Góndola y precio</h2>
    <label class="f">Exhibición según lo acordado</label><div class="seg" data-k="exhib">${["Sí","Parcial","No"].map(x=>`<button data-x="${x}" class="${f.ejec.exhib===x?"on":""}">${x}</button>`).join("")}</div>
    <div class="grid3" style="margin-top:10px">
      <div><label class="f">Frentes LOMUS</label><input type="number" inputmode="numeric" min="0" data-e="frentesL" value="${f.ejec.frentesL??""}"></div>
      <div><label class="f">Frentes competencia</label><input type="number" inputmode="numeric" min="0" data-e="frentesC" value="${f.ejec.frentesC??""}"></div>
      <div><label class="f">Temp. nevera °C</label><input type="number" inputmode="decimal" step="0.1" data-e="temp" value="${f.ejec.temp??""}"></div>
    </div>
    <div class="grid2" style="margin-top:10px">
      <div><label class="f">Precio LOMUS bien marcado</label><div class="seg" data-k="precioOk">${["Sí","No"].map(x=>`<button data-x="${x}" class="${f.ejec.precioOk===x?"on":""}">${x}</button>`).join("")}</div></div>
      <div><label class="f">Material POP instalado</label><div class="seg" data-k="pop">${["Sí","No"].map(x=>`<button data-x="${x}" class="${f.ejec.pop===x?"on":""}">${x}</button>`).join("")}</div></div>
    </div>

  <dt>1. Sell-out (venta al consumidor)</dt><dd>Inventario inicial + recibido − inventario final − avería. Se suma en kg equivalentes (paquetes de 500 g = 0,5 kg).</dd>
  <dt>2. Días de inventario (rotación)</dt><dd>Inventario actual en góndola ÷ venta promedio diaria. Meta ≤ ${M.doh} días. Si sube, el producto envejece en nevera y termina en devolución.</dd>
  <dt>3. % merma / devolución</dt><dd>Avería y devolución ÷ (venta + avería). Meta ≤ ${pct(M.merma,1)}.</dd>
  <dt>4. Kg en riesgo de vencimiento</dt><dd>Producto en góndola que vence en ${M.alertaVto} días o menos. Es la alerta temprana de la devolución: se ataca con FEFO (lo que vence primero, adelante), degustación y abordaje.</dd>
  <dt>5. Disponibilidad en góndola (OSA)</dt><dd>Referencias no agotadas ÷ referencias revisadas. Meta ≥ ${pct(M.osa)}. Un agotado es venta perdida.</dd>
  <dt>6. Share of shelf</dt><dd>Frentes LOMUS ÷ (frentes LOMUS + competencia). Meta ≥ ${pct(M.sos)}.</dd>
  <dt>7. Exhibición y precio</dt><dd>% de visitas con exhibición acordada y precio bien marcado, con foto como evidencia.</dd>
  <dt>8. Conversión del impulso</dt><dd>Compras logradas ÷ personas abordadas. Meta ≥ ${pct(M.conv)}.</dd>
  <dt>9. Trazabilidad del reporte</dt><dd>Días con registro ÷ días del periodo, y % de registros hechos el mismo día. Descanso o festivo se registran como tipo de día.</dd>
  </dl></div>
  <div class="card"><h2>Rutina diaria sugerida</h2><dl class="defs"><dt>Al llegar (turno mañana)</dt><dd>Revisa inventario inicial (viene precargado), fechas de vencimiento y temperatura. Rota FEFO.</dd><dt>Durante el turno</dt><dd>Exhibición, precio, abordaje y degustación sobre las referencias con más días de inventario o que vencen pronto.</dd><dt>Al cierre</dt><dd>Inventario final, avería, competencia y novedades. Guarda antes de salir.</dd></dl></div>`;
}

/* ============ Configuración (dueña) ============ */
function renderCfg(){
  if(!S.isOwner){$("#main").innerHTML=`<div class="empty">Solo administración.</div>`;return}
  const c=JSON.parse(JSON.stringify(S.cfg||{catalogo:[],pdvs:[],equipo:[],metas:{}}));c.metas=Object.assign({},metas(),c.metas||{});
  S._cfgEdit=c;
  const M=c.metas;
  $("#main").innerHTML=`<div class="banner info">Los cambios se aplican a todo el equipo al tocar <b>Guardar configuración</b>.</div>
  <div class="card"><h2>Metas</h2><div class="grid3">
   <div><label class="f">Días de inventario máx.</label><input type="number" step="0.5" data-m="doh" value="${M.doh}"></div>
   <div><label class="f">% merma máx.</label><input type="number" step="0.1" data-m="merma" data-pct value="${+(M.merma*100).toFixed(2)}"></div>
   <div><label class="f">OSA mín. %</label><input type="number" step="1" data-m="osa" data-pct value="${+(M.osa*100).toFixed(1)}"></div>
   <div><label class="f">Alerta vencimiento (días)</label><input type="number" step="1" data-m="alertaVto" value="${M.alertaVto}"></div>
   <div><label class="f">Share of shelf mín. %</label><input type="number" step="1" data-m="sos" data-pct value="${+(M.sos*100).toFixed(1)}"></div>
   <div><label class="f">Conversión mín. %</label><input type="number" step="1" data-m="conv" data-pct value="${+(M.conv*100).toFixed(1)}"></div>
  </div></div>
  <div class="card"><h2>Equipo</h2><div class="tw"><table class="cfgtable"><thead><tr><th>Nombre</th><th>Rol</th><th>Ciudad</th><th>Puntos asignados</th><th>Activo</th></tr></thead><tbody id="cEq"></tbody></table></div><button class="btn ghost" id="addEq" style="margin-top:8px">+ Persona</button></div>
  <div class="card"><h2>Puntos de venta</h2><div class="tw"><table class="cfgtable"><thead><tr><th>Nombre</th><th>Cadena</th><th>Ciudad</th><th>Activo</th></tr></thead><tbody id="cPdv"></tbody></table></div><button class="btn ghost" id="addPdv" style="margin-top:8px">+ Punto</button></div>
  <div class="card"><h2>Catálogo</h2><p class="hint">Unidad “und” con peso por unidad (kg) permite sumar todo en kg. Si no conoces el peso, déjalo vacío.</p><div class="tw"><table class="cfgtable"><thead><tr><th>Código</th><th>Producto</th><th>Unidad</th><th>Peso und (kg)</th><th>Activo</th></tr></thead><tbody id="cCat"></tbody></table></div><button class="btn ghost" id="addCat" style="margin-top:8px">+ Producto</button></div>
  <div class="card"><h2>Personas vinculadas</h2><div id="cPerf" class="small">Cargando…</div></div>
  <div class="row"><span class="sp"></span><button class="btn" id="cfgSave">Guardar configuración</button></div>`;
  drawCfgTables();
  document.querySelectorAll("[data-m]").forEach(i=>i.oninput=()=>{const v=num(i.value);c.metas[i.dataset.m]=i.hasAttribute("data-pct")?(v===null?null:v/100):v});
  $("#addEq").onclick=()=>{c.equipo.push({id:"imp-"+Date.now().toString(36),nombre:"",rol:"impulsadora",ciudad:"",pdvs:[],activo:true});drawCfgTables()};
  $("#addPdv").onclick=()=>{c.pdvs.push({id:"pdv-"+Date.now().toString(36),nombre:"",cadena:"",ciudad:"",activo:true});drawCfgTables()};
  $("#addCat").onclick=()=>{c.catalogo.push({cod:"",nombre:"",unidad:"kg",peso:null,activo:true});drawCfgTables()};
  $("#cfgSave").onclick=async()=>{const b=$("#cfgSave");b.disabled=true;b.textContent="Guardando…";
    c.equipo=c.equipo.filter(e=>e.nombre.trim());c.pdvs=c.pdvs.filter(p=>p.nombre.trim());c.catalogo=c.catalogo.filter(p=>String(p.cod).trim()&&p.nombre.trim());
    try{await withTimeout(S.db.doc("config/general").set(c),15000);toast("Configuración guardada ✓")}catch(e){toast("No se pudo guardar la configuración.")}b.disabled=false;b.textContent="Guardar configuración"};
  loadPerfiles();
}
function drawCfgTables(){const c=S._cfgEdit;
  $("#cEq").innerHTML=c.equipo.map((e,i)=>`<tr data-i="${i}"><td><input type="text" data-f="nombre" value="${esc(e.nombre)}"></td><td><select data-f="rol"><option value="impulsadora" ${e.rol!=="supervisor"?"selected":""}>Mercaimpulsadora</option><option value="supervisor" ${e.rol==="supervisor"?"selected":""}>Supervisión</option></select></td><td><input type="text" data-f="ciudad" value="${esc(e.ciudad||"")}"></td><td><select multiple data-f="pdvs" style="min-height:70px">${c.pdvs.map(p=>`<option value="${esc(p.id)}" ${(e.pdvs||[]).includes(p.id)?"selected":""}>${esc(p.nombre)}</option>`).join("")}</select></td><td><input type="checkbox" data-f="activo" ${e.activo!==false?"checked":""}></td></tr>`).join("");
  $("#cPdv").innerHTML=c.pdvs.map((p,i)=>`<tr data-i="${i}"><td><input type="text" data-f="nombre" value="${esc(p.nombre)}"></td><td><input type="text" data-f="cadena" value="${esc(p.cadena||"")}"></td><td><input type="text" data-f="ciudad" value="${esc(p.ciudad||"")}"></td><td><input type="checkbox" data-f="activo" ${p.activo!==false?"checked":""}></td></tr>`).join("");
  $("#cCat").innerHTML=c.catalogo.map((p,i)=>`<tr data-i="${i}"><td><input type="text" data-f="cod" value="${esc(p.cod)}" style="width:80px"></td><td><input type="text" data-f="nombre" value="${esc(p.nombre)}"></td><td><select data-f="unidad"><option value="kg" ${p.unidad==="kg"?"selected":""}>kg</option><option value="und" ${p.unidad!=="kg"?"selected":""}>und</option></select></td><td><input type="number" step="0.01" data-f="peso" value="${p.peso??""}" style="width:80px"></td><td><input type="checkbox" data-f="activo" ${p.activo!==false?"checked":""}></td></tr>`).join("");
  const bind=(sel,arr)=>document.querySelectorAll(sel+" tr").forEach(tr=>tr.querySelectorAll("[data-f]").forEach(inp=>inp.onchange=inp.oninput=()=>{const o=arr[+tr.dataset.i],k=inp.dataset.f;if(inp.type==="checkbox")o[k]=inp.checked;else if(inp.multiple)o[k]=[...inp.selectedOptions].map(x=>x.value);else if(k==="peso")o[k]=num(inp.value);else o[k]=inp.value}));
  bind("#cEq",c.equipo);bind("#cPdv",c.pdvs);bind("#cCat",c.catalogo);
}
async function loadPerfiles(){const el=$("#cPerf");try{const s=await withTimeout(S.db.collection("perfiles").limit(200).get(),10000);const ps=s.docs.map(d=>({uid:d.id,...d.data()}));let names={};try{if(S.user&&S.user.profiles)names=await S.user.profiles(ps.map(p=>p.uid))||{}}catch(e){}
  el.innerHTML=ps.length?`<table><thead><tr><th>Cuenta</th><th>Se identificó como</th><th>Desde</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc((names[p.uid]&&names[p.uid].name)||"Cuenta "+p.uid.slice(0,6))}</td><td>${esc((impBy(p.impId)||{}).nombre||p.impId)}</td><td>${esc((p.desde||"").slice(0,10))}</td></tr>`).join("")}</tbody></table>`:"Nadie se ha identificado aún."}catch(e){el.textContent="No se pudo cargar."}}

init();
</script>
</body>
</html>
